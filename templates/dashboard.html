{% extends "layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block styles %}
<style>
    .dashboard-container {
        position: fixed;
        top: 0;
        left: 250px; /* Add space for sidebar */
        width: calc(100% - 250px); /* Adjust width to account for sidebar */
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8f9fa;
        z-index: 1000;
    }

    .dashboard-image {
        width: 90%;
        height: 90%;
    }

    /* Override layout margins for dashboard */
    .main-content {
        margin-left: 250px !important;
        padding: 0 !important;
        min-height: 100vh !important;
    }

    /* Remove the sidebar hiding rule */
    .header-bar {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}  
{% with active_page=request.endpoint %}
    {% include 'components/sidebar.html' %}
    {% endwith %}

<div class="dashboard-container">
    <img src="{{ url_for('static', filename='powerbi.png') }}" alt="PowerBI Dashboard" class="dashboard-image">
</div>
{% endblock %}
