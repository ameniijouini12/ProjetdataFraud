{% extends "layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block styles %}
<style>
    .dashboard-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8f9fa;
        z-index: 1000;
    }

    .dashboard-image {
        width: 86%;
        height: 86%;
       
    }

    /* Override layout margins for full screen */
    .main-content {
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100vh !important;
    }

    /* Hide header and sidebar for full screen view */
    .header-bar, .sidebar {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <img src="{{ url_for('static', filename='powerbi.png') }}" alt="PowerBI Dashboard" class="dashboard-image">
</div>
{% endblock %}
